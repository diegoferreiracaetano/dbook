<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Expiração de reservas pendentes (SQS)</title>
  <desc>Fluxo: a reserva é criada PENDING, uma mensagem com atraso de 15 minutos é agendada na SQS, e o consumidor cancela a reserva se ela ainda estiver PENDING; falhas vão para a DLQ.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#FFFFFF"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0F172A">Expiração de reservas pendentes</text>
  <text x="30" y="58" font-size="13" fill="#475569">Uma reserva PENDING segura o assento; sem pagamento em 15 minutos, ela é cancelada e o assento volta a ficar livre.</text>

  <!-- Linha 1: criação e pagamento -->
  <rect x="30" y="85" width="190" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="125" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">App mobile</text>
  <text x="125" y="132" text-anchor="middle" font-size="12" fill="#475569">POST /bookings</text>

  <rect x="270" y="85" width="190" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="365" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">RegisterBookingUseCase</text>
  <text x="365" y="132" text-anchor="middle" font-size="12" fill="#475569">reserva o assento</text>

  <rect x="510" y="85" width="210" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="615" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">PostgreSQL</text>
  <text x="615" y="132" text-anchor="middle" font-size="12" fill="#475569">Booking PENDING · Seat RESERVED</text>

  <rect x="770" y="85" width="200" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="870" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">POST /payments</text>
  <text x="870" y="132" text-anchor="middle" font-size="12" fill="#475569">confirma a reserva</text>

  <line x1="220" y1="117" x2="268" y2="117" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="117" x2="508" y2="117" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="117" x2="722" y2="117" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Corrida pagar x expirar -->
  <rect x="520" y="178" width="450" height="52" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="535" y="199" font-size="12.5" font-weight="600" fill="#713F12">Corrida pagar × expirar</text>
  <text x="535" y="217" font-size="12" fill="#713F12">@Version na Booking: se os dois tentam ao mesmo tempo, só um vence.</text>

  <!-- Agendamento -->
  <line x1="365" y1="149" x2="365" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="172" font-size="12" font-weight="600" fill="#0F172A">afterCommit</text>
  <text x="375" y="188" font-size="12" fill="#475569">agenda a expiração</text>

  <rect x="270" y="210" width="190" height="74" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
  <text x="365" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">SQS · expiração</text>
  <text x="365" y="255" text-anchor="middle" font-size="12" fill="#475569">atraso de 15 min</text>
  <text x="365" y="271" text-anchor="middle" font-size="12" fill="#475569">(DelaySeconds 900)</text>

  <!-- SQS -> consumidor -->
  <polyline points="300,284 300,318 135,318 135,348" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="337" font-size="12" fill="#475569">após 15 min a mensagem fica visível</text>

  <!-- Linha 3: consumo -->
  <rect x="30" y="350" width="210" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="135" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">BookingExpirationConsumer</text>
  <text x="135" y="397" text-anchor="middle" font-size="12" fill="#475569">@Scheduled · long polling</text>

  <rect x="290" y="350" width="190" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="385" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">ExpireBookingUseCase</text>
  <text x="385" y="397" text-anchor="middle" font-size="12" fill="#475569">idempotente</text>

  <line x1="240" y1="382" x2="288" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="382" x2="518" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="600,336 680,382 600,428 520,382" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="379" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">ainda</text>
  <text x="600" y="395" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">PENDING?</text>

  <!-- sim -->
  <line x1="600" y1="428" x2="600" y2="478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="458" font-size="12" font-weight="600" fill="#15803D">sim</text>
  <rect x="490" y="480" width="220" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="600" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Cancela e libera o assento</text>
  <text x="600" y="527" text-anchor="middle" font-size="12" fill="#475569">reserva CANCELLED · Seat AVAILABLE</text>

  <!-- nao -->
  <line x1="680" y1="382" x2="758" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="374" font-size="12" font-weight="600" fill="#B45309">não</text>
  <rect x="760" y="350" width="210" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="865" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Nada a fazer</text>
  <text x="865" y="397" text-anchor="middle" font-size="12" fill="#475569">já paga, cancelada ou inexistente</text>

  <!-- apaga -->
  <line x1="865" y1="414" x2="865" y2="478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="512" x2="758" y2="512" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="480" width="210" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="865" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Apaga a mensagem</text>
  <text x="865" y="527" text-anchor="middle" font-size="12" fill="#475569">só depois de processar</text>

  <!-- falha -> DLQ -->
  <line x1="135" y1="414" x2="135" y2="478" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-fail)"/>
  <text x="147" y="440" font-size="12" fill="#B91C1C">falhou: não apaga a mensagem</text>
  <text x="147" y="456" font-size="12" fill="#B91C1C">reentrega após 30 s</text>
  <rect x="30" y="480" width="210" height="64" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="135" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Dead-letter queue</text>
  <text x="135" y="527" text-anchor="middle" font-size="12" fill="#475569">após 3 falhas (maxReceiveCount)</text>

  <text x="30" y="590" font-size="12" fill="#64748B">Linha tracejada vermelha = caminho de falha. A fila entrega pelo menos uma vez, por isso o consumidor é idempotente.</text>
</svg>
