# Run in CI (and locally: docker run --rm -v "$PWD:/tf" bridgecrew/checkov -d /tf --config-file /tf/.checkov.yaml).
# A new finding fails the build. What is skipped below is a decision, not an oversight: each line says why, and the
# groups say what would make us revisit it. Without an AWS account there is no `plan` to check either (see docs/custos.md).
framework:
  - terraform
compact: true
quiet: true
skip-check:
  # --- a static site and a learning project: the cost and the work are not worth the gain (revisit with real traffic)
  - CKV_AWS_18      # S3 access logging (the portal bucket is private and only CloudFront reads it)
  - CKV2_AWS_62     # S3 event notifications (nothing consumes them)
  - CKV_AWS_144     # S3 cross-region replication (the build is reproducible from the repository)
  - CKV_AWS_145     # S3 KMS CMK (AES256 is on; a CMK adds cost and a key to manage)
  - CKV_AWS_86      # CloudFront access logging
  - CKV_AWS_68      # CloudFront WAF
  - CKV2_AWS_47     # CloudFront WAF (Log4j rule)
  - CKV_AWS_310     # CloudFront origin failover (one origin)
  - CKV_AWS_374     # CloudFront geo restriction (the team can be anywhere)
  - CKV2_AWS_42     # custom certificate: optional by design (portal_certificate_arn); the default one has no custom domain
  - CKV_AWS_174     # TLS 1.2 minimum: not settable with the default CloudFront certificate; set with a custom one
  - CKV2_AWS_57     # secret rotation (the secrets are generated by Terraform; rotation is a runbook, not automatic)
  - CKV_AWS_149     # secrets encrypted with a KMS CMK (the AWS managed key is on)
  # --- infrastructure that predates M43 (M6-M8): enabling these forces replacement or costs money; tracked for a real launch
  - CKV_AWS_16      # RDS encryption at rest (forces a new instance)
  - CKV_AWS_157     # RDS Multi-AZ
  - CKV_AWS_161     # RDS IAM authentication
  - CKV_AWS_118     # RDS enhanced monitoring
  - CKV_AWS_129     # RDS logs
  - CKV_AWS_226     # RDS automatic minor upgrades
  - CKV_AWS_293     # RDS deletion protection
  - CKV_AWS_353     # RDS performance insights
  - CKV2_AWS_30     # RDS query logging
  - CKV2_AWS_60     # RDS copy tags to snapshots
  - CKV_AWS_134     # ElastiCache backups (Redis here is a cache and a rate-limit counter)
  - CKV_AWS_136     # ECR KMS
  - CKV_AWS_119     # DynamoDB KMS CMK (the lock table)
  - CKV_AWS_28      # DynamoDB point in time recovery (the lock table)
  - CKV_AWS_158     # CloudWatch log group KMS
  - CKV_AWS_338     # logs kept one year (seven days here, for cost)
  - CKV_AWS_65      # ECS container insights
  - CKV_AWS_333     # ECS public IP: there is no load balancer in this setup, the task is the entry point
  - CKV_AWS_130     # public subnets assign public IPs (same reason)
  - CKV_AWS_23      # security group descriptions
  - CKV_AWS_382     # open egress (the task calls SQS, SES, Bedrock and the internet)
  - CKV2_AWS_11     # VPC flow logs
  - CKV2_AWS_12     # default security group
  - CKV2_AWS_56     # IAMFullAccess for the CI role (a documented simplification in the github_oidc module)
  - CKV2_AWS_61     # S3 lifecycle on the Terraform state bucket (versions are the point of it)
