name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs tests (Testcontainers spins up its own Postgres — ubuntu-latest ships
      # Docker out of the box, no docker-compose step needed here) + ktlint + detekt.
      - name: Run check
        run: ./gradlew check
