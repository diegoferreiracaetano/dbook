name: CD

# Runs only after CI (test+lint+detekt) succeeds on main — never deploys code that
# hasn't passed the same gate a PR would have to pass.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for OIDC federation (no long-lived AWS keys stored here)
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dbook

jobs:
  # The `secrets` context can't be used in a job-level `if`, so this job copies the
  # secret's presence into an output the others can check. Without the secret (no AWS
  # account — the AWS Academy lab is temporary) the whole pipeline is skipped instead of
  # failing red on every push; it starts working by itself once AWS_DEPLOY_ROLE_ARN exists.
  check-aws:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check AWS deploy role is configured
        id: gate
        run: echo "enabled=${{ env.AWS_DEPLOY_ROLE_ARN != '' }}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: check-aws
    if: github.event.workflow_run.conclusion == 'success' && needs.check-aws.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: tag
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The ECR repository is IMMUTABLE (see terraform/modules/ecr) — every push needs a
      # unique tag, which is exactly why this uses the commit SHA instead of "latest".
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # Auto-deploys to dev — no manual step, matches "após merge" from the checklist.
  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config=backend-aws.hcl

      - name: Terraform apply
        run: >
          terraform apply -auto-approve
          -var="use_localstack=false"
          -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}"

  # Same infrastructure as dev in this project (a real production setup would target a
  # separate environment/state) — what matters here is the gate: this job only starts
  # once a reviewer approves it, via the "production" GitHub Environment's protection
  # rules (Settings -> Environments -> production -> required reviewers).
  deploy-prod:
    needs: [build-and-push, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config=backend-aws.hcl

      - name: Terraform apply
        run: >
          terraform apply -auto-approve
          -var="use_localstack=false"
          -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}"

  # The admin portal (Flutter Web, apps/dbook_admin) is a static site: build it, put it in its bucket and make
  # CloudFront forget the old files. It waits for the infrastructure (the bucket and the distribution come from the
  # same Terraform) and skips itself when the portal does not exist yet in this repository.
  deploy-portal:
    needs: [check-aws, deploy-dev]
    if: github.event.workflow_run.conclusion == 'success' && needs.check-aws.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Is there a portal to deploy?
        id: portal
        run: echo "present=$([ -f apps/dbook_admin/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.portal.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the portal
        if: steps.portal.outputs.present == 'true'
        working-directory: apps/dbook_admin
        run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Configure AWS credentials
        if: steps.portal.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        if: steps.portal.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Where does the portal go?
        if: steps.portal.outputs.present == 'true'
        id: target
        working-directory: terraform
        run: |
          terraform init -backend-config=backend-aws.hcl
          echo "bucket=$(terraform output -raw portal_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw portal_distribution_id)" >> "$GITHUB_OUTPUT"

      # index.html is never cached (a new deploy must be seen at once); the hashed files Flutter generates can be
      - name: Upload the portal
        if: steps.portal.outputs.present == 'true'
        run: |
          aws s3 sync apps/dbook_admin/build/web "s3://${{ steps.target.outputs.bucket }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/dbook_admin/build/web/index.html "s3://${{ steps.target.outputs.bucket }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate the cache
        if: steps.portal.outputs.present == 'true'
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.target.outputs.distribution }}" --paths "/*"

