name: CD

# Runs only after CI (test+lint+detekt) succeeds on main — never deploys code that
# hasn't passed the same gate a PR would have to pass.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for OIDC federation (no long-lived AWS keys stored here)
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dbook

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: tag
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The ECR repository is IMMUTABLE (see terraform/modules/ecr) — every push needs a
      # unique tag, which is exactly why this uses the commit SHA instead of "latest".
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # Auto-deploys to dev — no manual step, matches "após merge" from the checklist.
  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config=backend-aws.hcl

      - name: Terraform apply
        run: >
          terraform apply -auto-approve
          -var="use_localstack=false"
          -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}"

  # Same infrastructure as dev in this project (a real production setup would target a
  # separate environment/state) — what matters here is the gate: this job only starts
  # once a reviewer approves it, via the "production" GitHub Environment's protection
  # rules (Settings -> Environments -> production -> required reviewers).
  deploy-prod:
    needs: [build-and-push, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config=backend-aws.hcl

      - name: Terraform apply
        run: >
          terraform apply -auto-approve
          -var="use_localstack=false"
          -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}"
