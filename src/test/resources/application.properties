booking-expiration.consumer.enabled=false
# random management port: tests never compete with a local bootRun for 8081
management.server.port=0
login-attempts.max-failures-per-ip=100000
# the outbox relay is driven by the tests that need it (there is no SQS here)
outbox.relay.enabled=false
notifications.consumer.enabled=false
# many tests call the API from the same address: the limits have their own tests, with their own context
request-limits.rate-limit-enabled=false
# BCrypt at the minimum cost in the tests: they sign users in thousands of times (production uses 12)
security.bcrypt-strength=4
# the flight search cache has its own tests (they turn it on): the others book and search right away
flight-search-cache.enabled=false
