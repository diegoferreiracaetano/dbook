spring:
  application:
    name: dbook
  # Authentication is 100% JWT-based (see JwtAuthenticationFilter) — there's no
  # UserDetailsService/form login, so this default auto-config just generates a
  # useless password and warns on every startup. Excluded to keep the log clean.
  autoconfigure:
    # (1) no UserDetailsService: authentication is 100% JWT. (2) no OTLP trace exporter by default:
    # without a collector it would log "Failed to export spans" all the time. Spans are still
    # created (the traceId is in every log line); run with the "tracing" profile to export them.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/dbook
    username: dbook
    password: dbook
    hikari:
      pool-name: dbook-pool
      # see docs/desempenho.md: the pool is small on purpose, the database does the work with few connections
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      # a request that cannot get a connection in 3 s fails instead of piling up behind the others
      connection-timeout: 3000
      # a connection held longer than this is logged with the stack of who took it (a leak or a slow call inside a
      # transaction), the warning behind the DatabasePoolSaturated runbook
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080
# The second factor of the team (see docs/autenticacao.md). The key that keeps the TOTP secrets unreadable in the
# database: local-dev only here, production reads it from Secrets Manager (TOTP_ENCRYPTION_KEY).
totp:
  encryption-key: ${TOTP_ENCRYPTION_KEY:dev-only-totp-key-never-use-it-in-production-0000}
admin:
  two-factor:
    # the roles that MUST have a second factor (comma separated); empty in local dev so the seed script and the
    # tests can sign in with a password alone. Production sets ADMIN_2FA_REQUIRED_ROLES=SUPER_ADMIN.
    required-roles: ${ADMIN_2FA_REQUIRED_ROLES:}
    issuer: DBook
jwt:
  # Local-dev only secret. Production reads this from AWS Secrets Manager (M6 decision),
  # never committed as a real secret.
  secret: baB82M7DHaS9cSjspi0J4hJS05eUKmSLOu0hbOivY0k=
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
# Key rotation (see JwtKeyProperties): jwt.secret is the active key and signs; the retired ones only verify.
# To rotate: JWT_KEYS_RETIRED_<OLDID>=<old secret>, JWT_SECRET=<new>, JWT_KEYS_ACTIVE_KEY_ID=<new id>.
jwt-keys:
  active-key-id: ${JWT_KEYS_ACTIVE_KEY_ID:k1}
login-attempts:
  window-minutes: 15
  max-failures-per-email: 5
  max-failures-per-ip: 20
cors:
  allowed-origins: http://localhost:*,http://127.0.0.1:*
scheduling:
  # a thread per @Scheduled job (4 today) plus room to grow, see SchedulingConfig; EachScheduledJobHasAThreadOfItsOwnTest
  # fails when a job is added beyond this
  pool-size: 6
flight-search-cache:
  # the public search is kept in Redis this long; seats taken meanwhile show up when the copy expires
  enabled: ${FLIGHT_SEARCH_CACHE_ENABLED:true}
  ttl-seconds: ${FLIGHT_SEARCH_CACHE_TTL_SECONDS:30}
dashboard:
  # how long a dashboard answer is kept in Redis; a number can be this old
  cache-ttl-seconds: ${DASHBOARD_CACHE_TTL_SECONDS:60}

# which app versions are served, per platform (GET /v1/app-config): raise minSupportedVersion to retire an old app
app-config:
  android:
    min-supported-version: ${APP_MIN_VERSION_ANDROID:0.0.0}
    latest-version: ${APP_LATEST_VERSION_ANDROID:0.0.0}
    store-url: ${APP_STORE_URL_ANDROID:}
  ios:
    min-supported-version: ${APP_MIN_VERSION_IOS:0.0.0}
    latest-version: ${APP_LATEST_VERSION_IOS:0.0.0}
    store-url: ${APP_STORE_URL_IOS:}

# The links of the mails sent to customers (confirm the address, choose a new password); the app must serve
# /verify-email and /reset-password there.
customer-app:
  base-url: ${CUSTOMER_APP_BASE_URL:http://localhost:3000}
account:
  # booking and paying ask for a confirmed e-mail address. Off in local development (no mail leaves the machine: the
  # link is only in the log); production sets ACCOUNT_REQUIRE_VERIFIED_EMAIL=true
  require-verified-email: ${ACCOUNT_REQUIRE_VERIFIED_EMAIL:false}
admin-portal:
  # where the invitation link points; the portal must serve /accept-invite there
  base-url: ${ADMIN_PORTAL_BASE_URL:http://localhost:3000}
  # Safari does not treat http://localhost as secure: run with ADMIN_PORTAL_COOKIE_SECURE=false there
  cookie-secure: ${ADMIN_PORTAL_COOKIE_SECURE:true}
bootstrap-admin:
  # creates the first SUPER_ADMIN at startup, only while none exists (set both or neither)
  email: ${DBOOK_BOOTSTRAP_ADMIN_EMAIL:}
  password: ${DBOOK_BOOTSTRAP_ADMIN_PASSWORD:}
email:
  # the invitation e-mail body carries the token: only print it for local development (EMAIL_LOG_BODY=true);
  # the app refuses to start with it on under the json (production) profile
  log-body: ${EMAIL_LOG_BODY:false}
ai:
  # bedrock (default: the model on AWS) | local (plain rules over the real flights, no credentials: development and demos)
  provider: ${AI_PROVIDER:bedrock}
  bedrock:
    region: us-east-1
    # NOTE (2026-09-09): Bedrock model IDs retire over time — every dated Claude 3.x
    # snapshot tried against this AWS Academy Lab account returned "reached the end of
    # its life". Verify the current catalog with `aws bedrock list-foundation-models`
    # (needs bedrock:ListFoundationModels, which this lab's IAM denies) or the Bedrock
    # console before relying on this in a real environment, and update this value.
    model-id: anthropic.claude-3-5-sonnet-20241022-v2:0
    # a slower answer is not worth waiting for (the customer has the plain search): the whole call, and each attempt
    timeout-seconds: ${AI_BEDROCK_TIMEOUT_SECONDS:10}
    attempt-timeout-seconds: ${AI_BEDROCK_ATTEMPT_TIMEOUT_SECONDS:6}
    # circuit breaker and bulkhead in front of the model (ai.bedrock.guard.*, see BedrockGuard)
    guard:
      open-seconds: 30
      max-concurrent-calls: 10
aws:
  sqs:
    region: us-east-1
    # LocalStack only. In AWS leave it empty (AWS_SQS_ENDPOINT=) so the SDK resolves the real endpoint.
    endpoint: http://localhost:4566
notifications:
  queue-url: http://localhost:4566/000000000000/dbook-notifications
  # its depth is the dbook.sqs.dlq.depth gauge, and an alert when above zero
  dlq-url: http://localhost:4566/000000000000/dbook-notifications-dlq
  consumer:
    # off in tests (no SQS there): see src/test/resources/application.properties
    enabled: true
    wait-seconds: 20
dead-letter-queues:
  queues:
    booking-expiration: ${booking-expiration.dlq-url}
    notifications: ${notifications.dlq-url}
outbox:
  # where each kind of event goes (the routing key is the event type minus its last word, with dashes)
  queues:
    booking-expiration: ${booking-expiration.queue-url}
    # the facts the customer is told about: confirmed / expired / cancelled bookings, refunds, flight changes
    booking: ${notifications.queue-url}
    refund: ${notifications.queue-url}
    flight: ${notifications.queue-url}
    # an alert that a price satisfied: the customer is told
    price-alert: ${notifications.queue-url}
  relay:
    delay-ms: 1000
booking-expiration:
  queue-url: http://localhost:4566/000000000000/dbook-booking-expiration
  # the dead-letter queue: its depth is the dbook.sqs.dlq.depth gauge (and an alert when above zero)
  dlq-url: http://localhost:4566/000000000000/dbook-booking-expiration-dlq
  consumer:
    # off in tests (no SQS there): see src/test/resources/application.properties
    enabled: true
    # long polling: SQS holds the call up to this long waiting for a message
    wait-seconds: 20
management:
  tracing:
    sampling:
      # every request is traced here (local development); lower it in production through the
      # MANAGEMENT_TRACING_SAMPLING_PROBABILITY environment variable
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    distribution:
      # histogram buckets, so Prometheus can compute percentiles (p95...) of these timers
      percentiles-histogram:
        http.server.requests: true
        dbook.usecase: true
  observations:
    enable:
      # Spring would open a one-span trace for EVERY run of a @Scheduled method: the queue consumer
      # polls every 5 s, which buried the useful traces in Jaeger. The span that matters
      # ("booking-expiration consume", one per message) is created by the consumer itself.
      tasks:
        scheduled:
          execution: false
    annotations:
      # makes @Observed work: each annotated use case gets a timer (and, later, a trace span)
      enabled: true
  server:
    # Operational endpoints live on their own port, never on the public one: the ECS task
    # (see terraform/modules/ecs) and the Dockerfile only expose 8080, so Prometheus scrapes
    # and health probes reach 8081 from inside the network only.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # not ready to receive traffic when a dependency is down
        readiness:
          include: readinessState,db,redis
