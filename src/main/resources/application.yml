spring:
  application:
    name: dbook
  # Authentication is 100% JWT-based (see JwtAuthenticationFilter) — there's no
  # UserDetailsService/form login, so this default auto-config just generates a
  # useless password and warns on every startup. Excluded to keep the log clean.
  autoconfigure:
    # (1) no UserDetailsService: authentication is 100% JWT. (2) no OTLP trace exporter by default:
    # without a collector it would log "Failed to export spans" all the time. Spans are still
    # created (the traceId is in every log line); run with the "tracing" profile to export them.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/dbook
    username: dbook
    password: dbook
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080
jwt:
  # Local-dev only secret. Production reads this from AWS Secrets Manager (M6 decision),
  # never committed as a real secret.
  secret: baB82M7DHaS9cSjspi0J4hJS05eUKmSLOu0hbOivY0k=
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
ai:
  bedrock:
    region: us-east-1
    # NOTE (2026-09-09): Bedrock model IDs retire over time — every dated Claude 3.x
    # snapshot tried against this AWS Academy Lab account returned "reached the end of
    # its life". Verify the current catalog with `aws bedrock list-foundation-models`
    # (needs bedrock:ListFoundationModels, which this lab's IAM denies) or the Bedrock
    # console before relying on this in a real environment, and update this value.
    model-id: anthropic.claude-3-5-sonnet-20241022-v2:0
aws:
  sqs:
    region: us-east-1
    # LocalStack only. In AWS leave it empty (AWS_SQS_ENDPOINT=) so the SDK resolves the real endpoint.
    endpoint: http://localhost:4566
booking-expiration:
  queue-url: http://localhost:4566/000000000000/dbook-booking-expiration
  consumer:
    # off in tests (no SQS there): see src/test/resources/application.properties
    enabled: true
    # long polling: SQS holds the call up to this long waiting for a message
    wait-seconds: 20
management:
  tracing:
    sampling:
      # every request is traced here (local development); lower it in production through the
      # MANAGEMENT_TRACING_SAMPLING_PROBABILITY environment variable
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    distribution:
      # histogram buckets, so Prometheus can compute percentiles (p95...) of these timers
      percentiles-histogram:
        http.server.requests: true
        dbook.usecase: true
  observations:
    enable:
      # Spring would open a one-span trace for EVERY run of a @Scheduled method: the queue consumer
      # polls every 5 s, which buried the useful traces in Jaeger. The span that matters
      # ("booking-expiration consume", one per message) is created by the consumer itself.
      tasks:
        scheduled:
          execution: false
    annotations:
      # makes @Observed work: each annotated use case gets a timer (and, later, a trace span)
      enabled: true
  server:
    # Operational endpoints live on their own port, never on the public one: the ECS task
    # (see terraform/modules/ecs) and the Dockerfile only expose 8080, so Prometheus scrapes
    # and health probes reach 8081 from inside the network only.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # not ready to receive traffic when a dependency is down
        readiness:
          include: readinessState,db,redis
